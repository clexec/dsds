# ─── Недостающие ключи (добавлены патчем) ────────────────────────────────────
help_rep_text: "<b>Как работает:</b>\nОтветь на сообщение одним из триггеров.\n\n<b>Повышение:</b> <code>+</code>, <code>++</code>, <code>+реп</code>, <code>уважение</code>, <code>красава</code>, <code>огонь</code>, <code>топ</code>, <code>молодец</code>, <code>спасибо</code>, <code>gg</code> и др.\n\n<b>Понижение:</b> <code>-</code>, <code>--</code>, <code>-реп</code>, <code>диз</code>, <code>бред</code>, <code>кринж</code>, <code>зашквар</code>, <code>дно</code> и др.\n\n<b>L</b> <code>!рейтинг</code> [@user] — репутация пользователя\n<b>L</b> <code>!репутация</code> — топ-25 по репутации\n<b>L</b> <code>!репзнак</code> +5/-3 — изменить вручную (персонал)\n<b>L</b> <code>!титулы</code> — список титулов по репутации\n<b>L</b> <code>!добавититул</code> [мин] [макс] [название]\n<b>L</b> <code>!удалититул</code> [номер]\n\nЛимит: 5 оценок в день (меняется в панели)."

help_info_text: "<b>L</b> <code>!стафф</code> — список персонала группы\n<b>L</b> <code>!правила</code> — правила сообщества\n<b>L</b> <code>!топ</code> / <code>!топ день</code> / <code>!топ неделя</code> / <code>!топ месяц</code> / <code>!топ вся</code>\n<b>L</b> <code>!рейтинг</code> [@user/id/reply] — репутация\n<b>L</b> <code>!репутация</code> — топ-25 по репутации\n<b>L</b> <code>!инфо</code> — профиль пользователя\n<b>L</b> <code>!история</code> — история нарушений\n<b>L</b> <code>!предупреждения</code> — варны пользователя\n<b>L</b> <code>!кто</code> — роль и репутация (ответ)\n<b>L</b> <code>!обо мне</code> — ваш профиль\n<b>L</b> <code>!чат</code> — информация о чате\n<b>L</b> <code>!мои варны</code> — ваши предупреждения\n<b>L</b> <code>!статус</code> — статус функций группы\n<b>L</b> <code>!титулы</code> — титулы репутации\n<b>L</b> <code>!цензура список</code> — запрещённые слова"

help_settings_text: "<b>L</b> <code>!панель</code> — полная панель управления группой\n<b>L</b> <code>!настройки</code> — быстрые настройки\n<b>L</b> <code>!сетправила</code> [текст] — обновить правила\n<b>L</b> <code>!ссылка</code> [название] — создать инвайт-ссылку\n<b>L</b> <code>!пин</code> — закрепить сообщение (ответ)\n<b>L</b> <code>!откреп</code> — открепить все сообщения\n<b>L</b> <code>!рассылка</code> [текст] — рассылка во все группы (владелец бота)\n<b>L</b> <code>!грассылка</code> [текст] — рассылка в текущую группу (админ)\n\nВключить/выключить в <code>!панель</code>:\nприветствие, антифлуд, антиссылки, антиспам, цензура"

help_rights_text: "<b>L</b> <code>!модер</code> — назначить модератора (ответ)\n<b>L</b> <code>!админ</code> — назначить администратора (ответ)\n<b>L</b> <code>!сеньор</code> — назначить ст. админа (ответ)\n<b>L</b> <code>!деадмин</code> — снять с должности (ответ)\n\nИли через <code>!панель</code> → Персонал — визуальный менеджер.\n\nНазначать администраторов — только владелец.\nНазначать модераторов — любой администратор."

rules_not_set: "Правила не установлены."
rules_punishments: "Наказания:\n• 1 нарушение — предупреждение.\n• 2 нарушение — мут.\n• 3 нарушение — бан.\n\n<i>Повторный бан после разбана — без предупреждений.</i>"
channel_label: "Канал"
