  # ─── Missing keys (added by patch) ───────────────────────────────────────────
  help_rep_text: "<b>How it works:</b>\nReply to a message with one of the triggers.\n\n<b>Increase:</b> <code>+</code>, <code>++</code>, <code>+rep</code>, <code>respect</code>, <code>nice</code>, <code>fire</code>, <code>top</code>, <code>good job</code>, <code>thanks</code>, <code>gg</code> etc.\n\n<b>Decrease:</b> <code>-</code>, <code>--</code>, <code>-rep</code>, <code>dislike</code>, <code>cringe</code>, <code>trash</code>, <code>bad</code> etc.\n\n<b>L</b> <code>!rating</code> [@user] — user reputation\n<b>L</b> <code>!reputation</code> — top-25 by reputation\n<b>L</b> <code>!repsign</code> +5/-3 — change manually (staff)\n<b>L</b> <code>!titles</code> — list of reputation titles\n<b>L</b> <code>!addtitle</code> [min] [max] [name]\n<b>L</b> <code>!removetitle</code> [number]\n\nLimit: 5 ratings per day (configurable in panel)."

  help_info_text: "<b>L</b> <code>!staff</code> — group staff list\n<b>L</b> <code>!rules</code> — community rules\n<b>L</b> <code>!top</code> / <code>!top day</code> / <code>!top week</code> / <code>!top month</code> / <code>!top all</code>\n<b>L</b> <code>!rating</code> [@user/id/reply] — reputation\n<b>L</b> <code>!reputation</code> — top-25 by reputation\n<b>L</b> <code>!info</code> — user profile\n<b>L</b> <code>!history</code> — violation history\n<b>L</b> <code>!warnings</code> — user warnings\n<b>L</b> <code>!who</code> — role and reputation (reply)\n<b>L</b> <code>!about me</code> — your profile\n<b>L</b> <code>!chat</code> — chat information\n<b>L</b> <code>!my warnings</code> — your warnings\n<b>L</b> <code>!status</code> — feature status\n<b>L</b> <code>!titles</code> — reputation titles\n<b>L</b> <code>!censorship list</code> — banned words"

  help_settings_text: "<b>L</b> <code>!panel</code> — full group control panel\n<b>L</b> <code>!settings</code> — quick settings\n<b>L</b> <code>!setrules</code> [text] — update rules\n<b>L</b> <code>!link</code> [name] — create invite link\n<b>L</b> <code>!pin</code> — pin message (reply)\n<b>L</b> <code>!unpin</code> — unpin all messages\n<b>L</b> <code>!broadcast</code> [text] — broadcast to all groups (bot owner)\n<b>L</b> <code>!gbroadcast</code> [text] — broadcast to current group (admin)\n\nToggle in <code>!panel</code>:\nwelcome, antiflood, antilinks, antispam, censorship"

  help_rights_text: "<b>L</b> <code>!mod</code> — appoint moderator (reply)\n<b>L</b> <code>!admin</code> — appoint administrator (reply)\n<b>L</b> <code>!senior</code> — appoint senior admin (reply)\n<b>L</b> <code>!deadmin</code> — remove from position (reply)\n\nOr via <code>!panel</code> → Staff — visual manager.\n\nAppointing administrators — owner only.\nAppointing moderators — any administrator."

  rules_not_set: "Rules not set."
  rules_punishments: "Punishments:\n• 1st violation — warning.\n• 2nd violation — mute.\n• 3rd violation — ban.\n\n<i>Repeated ban after unban — no warnings.</i>"
  channel_label: "Channel"
